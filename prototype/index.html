<style>

<script>
'use strict';

/* ===== 内置样例：完全虚构的模拟数据，禁止替换成真实隐私数据 ===== */
const SAMPLES = [
  {
    name: 'notice-internship.txt',
    text: `关于做好 2026 届毕业实习材料提交工作的通知
发布单位：示例大学 材料与能源学院（模拟数据 · 非真实通知）

/* ===== 会话状态 ===== */
const state = { sources: [], items: [], seq: 0, highlight: null };

/* ===== DOM ===== */
const $ = (s) => document.querySelector(s);
const elDrop = $('#drop'), elPick = $('#pick'), elFile = $('#file'), elSample = $('#sample'),
      elClear = $('#clear'), elSources = $('#sources'), elRaw = $('#rawList'),
      elReview = $('#reviewList'), elConflict = $('#conflictBar'), elTodo = $('#todoList'),
      elListEmpty = $('#listEmpty'), elExport = $('#export'), elCopy = $('#copy'),
      elToast = $('#toast');

let toastTimer = null;
function toast(msg, ms) {
  elToast.textContent = msg;
  elToast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => elToast.classList.remove('on'), ms || 4200);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function nowStamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ===== 解析：.docx（手写 ZIP，零依赖） ===== */
async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}

async function readDocxXml(ab) {
  const view = new DataView(ab), bytes = new Uint8Array(ab);
  let eocd = -1;
  const floor = Math.max(0, bytes.length - 66000);
  for (let i = bytes.length - 22; i >= floor; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 .docx（找不到 ZIP 结尾记录）');

  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  let hit = null;
  for (let i = 0; i < count; i++) {
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 中央目录已损坏');
    const method = view.getUint16(p + 10, true);
    const compSize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const localOffset = view.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));
    if (name === 'word/document.xml') { hit = { method, compSize, localOffset }; break; }
    p += 46 + nameLen + extraLen + commentLen;
  }
  if (!hit) throw new Error('找不到 word/document.xml，可能不是标准 .docx');

  const lo = hit.localOffset;
  if (view.getUint32(lo, true) !== 0x04034b50) throw new Error('ZIP 本地头已损坏');
  const dataStart = lo + 30 + view.getUint16(lo + 26, true) + view.getUint16(lo + 28, true);
  const comp = bytes.subarray(dataStart, dataStart + hit.compSize);
  if (hit.method === 0) return new TextDecoder('utf-8').decode(comp);
  if (hit.method === 8) return inflateRaw(comp);
  throw new Error('不支持的压缩方式（method=' + hit.method + '）');
}

function unescapeXml(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
          .replace(/&amp;/g, '&');
}

function xmlToParagraphs(xml) {
  const out = [];
  const pre = /<w:p[\s>][\s\S]*?<\/w:p>|<w:p\/>/g;
  let m;
  while ((m = pre.exec(xml))) {
    let text = '';
    const tre = /<w:t[^>]*>([\s\S]*?)<\/w:t>|<w:tab\s*\/>|<w:br\s*\/>/g;
    let t;
    while ((t = tre.exec(m[0]))) text += (t[1] !== undefined ? t[1] : ' ');
    text = unescapeXml(text).replace(/\s+/g, ' ').trim();
    if (text) out.push(text);
  }
  return out;
}

function parseTxt(text) {
  return text.replace(/\r\n?/g, '\n').split('\n')
    .map((s) => s.replace(/\s+/g, ' ').trim())
    .filter(Boolean);
}

/* ===== 载入入口 ===== */
async function loadDocxFile(file) {
  let xml;
  try {
    xml = await readDocxXml(await file.arrayBuffer());
  } catch (e) {
    toast('无法解析该 .docx：' + e.message);
    return false;
  }
  const paragraphs = xmlToParagraphs(xml);
  if (!paragraphs.length) { toast('文件已读取，但没有解析出正文段落'); return false; }
  addSource(file.name, paragraphs);
  return true;
}

async function loadTxtFile(file) {
  let text;
  try { text = await file.text(); }
  catch (e) { toast('无法读取该文件：' + e.message); return false; }
  const paragraphs = parseTxt(text);
  if (!paragraphs.length) { toast('文件已读取，但没有解析出正文段落'); return false; }
  addSource(file.name, paragraphs);
  return true;
}

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let ok = 0;
  for (const f of files) {
    const lower = f.name.toLowerCase();
    if (lower.endsWith('.docx')) { if (await loadDocxFile(f)) ok++; }
    else if (lower.endsWith('.txt')) { if (await loadTxtFile(f)) ok++; }
    else { toast('暂不支持该格式：' + f.name + '（请上传 .txt 或 .docx）'); }
  }
  if (ok) renderAll();
}

/* ===== 规则式抽取（确定性正则，不调用任何模型）===== */
const pad = (n) => String(n).padStart(2, '0');
const RE_FULL = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/;
const RE_ISO  = /(\d{4})-(\d{1,2})-(\d{1,2})/;
const RE_SHORT= /(\d{1,2})\s*月\s*(\d{1,2})\s*日/;
const RE_TIME = /(\d{1,2}):(\d{2})/;
/* 注意：不能用 split(regex) 去空白——JS 的 split 会把捕获组插回结果，导致日期被拆散残留 */
const RE_FULL_G = new RegExp(RE_FULL.source, 'g');
const RE_ISO_G = new RegExp(RE_ISO.source, 'g');
const RE_SHORT_G = new RegExp(RE_SHORT.source, 'g');
const RE_TIME_G = new RegExp(RE_TIME.source, 'g');

const VAGUE_PATTERNS = [
  '考试结束后一周内', '考试结束后', '下周一之前', '下周一前', '下周一',
  '下周二之前', '下周二前', '下周二', '下周三之前', '下周三前', '下周三',
  '下周四之前', '下周四前', '下周四', '下周五之前', '下周五前', '下周五',
  '下周六之前', '下周六前', '下周六', '本周内', '本星期内', '本周',
  '一周之内', '一周内', '三日内', '三天内', '两周之内', '两周内',
  '近期', '近日', '尽快'
];
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const VAGUE_SORTED = VAGUE_PATTERNS.slice().sort((a, b) => b.length - a.length);
const RE_VAGUE = new RegExp(VAGUE_SORTED.map(escapeRe).join('|'));

const RE_VERB = /(?:提交至|提交到|报送至|报送到|上传至|上传到|发送至|发送到|交至|交到|送至|交于|寄至|发至|上交|提交|报送|上传|发送)/;
const RE_WHERE = /(?:交至|交到|送至|提交至|提交到|上传至|上传到|发送至|发送到|交于|寄至|发至|报送至|报送到)\s*([^，。；;\n]+)/;
const RE_EMAIL = /[\w.+-]+@[\w.-]+\.\w+/;

const OWNER_RULES = [
  [/各\s*班\s*学\s*习\s*委\s*员/, '各班学习委员'],
  [/全体\s*[^\s，。；、]{1,12}/, (m) => m.replace(/\s+/g, '')],
  [/各\s*班\s*级|各\s*班(?![学年])/, '各班级'],
  [/各\s*学\s*院/, '各学院'],
  [/各\s*参\s*赛\s*队\s*伍|各\s*队\s*伍/, '各参赛队伍'],
  [/任\s*课\s*教\s*师|各\s*位?\s*教\s*师/, '任课教师'],
  [/各\s*位?\s*同\s*学|同\s*学\s*们/, '同学们'],
  [/各\s*队/, '各队']
];

function detectOwner(text) {
  for (const [re, label] of OWNER_RULES) {
    const m = re.exec(text);
    if (m) return typeof label === 'function' ? label(m[0]) : label;
  }
  return null;
}

function sentenceAt(text, idx) {
  const stops = '。；;！!？?\n';
  let s = Math.max(0, idx);
  while (s > 0 && stops.indexOf(text[s - 1]) === -1) s--;
  let e = Math.max(0, idx);
  while (e < text.length && stops.indexOf(text[e]) === -1) e++;
  return text.slice(s, e).trim();
}

function detectDue(text) {
  let m = RE_FULL.exec(text);
  if (m) {
    const tm = RE_TIME.exec(text);
    const time = tm ? ' ' + pad(+tm[1]) + ':' + tm[2] : '';
    return {
      due: m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]) + time,
      dueRaw: m[0] + time, idx: m.index, vague: false, hasYear: true
    };
  }
  m = RE_ISO.exec(text);
  if (m) {
    const tm = RE_TIME.exec(text);
    const time = tm ? ' ' + pad(+tm[1]) + ':' + tm[2] : '';
    return {
      due: m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]) + time,
      dueRaw: m[0] + time, idx: m.index, vague: false, hasYear: true
    };
  }
  const stripped = text.replace(RE_FULL_G, ' ').replace(RE_ISO_G, ' ');
  m = RE_SHORT.exec(stripped);
  if (m) {
    const tm = RE_TIME.exec(stripped);
    const time = tm ? ' ' + pad(+tm[1]) + ':' + tm[2] : '';
    return {
      due: new Date().getFullYear() + '-' + pad(+m[1]) + '-' + pad(+m[2]) + time,
      dueRaw: m[0] + time, idx: 0, vague: false, hasYear: false
    };
  }
  m = RE_VAGUE.exec(text);
  if (m) return { due: null, dueRaw: m[0], idx: m.index, vague: true, hasYear: false };
  return null;
}

function cleanAction(text, owner) {
  let t = String(text);
  t = t.replace(/^\s*(?:\d+[.、)]|[（(]\d+[)）]|[一二三四五六七八九十]+[、.])\s*/, '');
  t = t.replace(RE_FULL_G, ' ').replace(RE_ISO_G, ' ').replace(RE_SHORT_G, ' ').replace(RE_TIME_G, ' ');
  for (const v of VAGUE_SORTED) t = t.split(v).join(' ');
  t = t.replace(/[（(]\s*(?:周|星期|礼拜)?\s*[一二三四五六日天]\s*[)）]/g, ' ');
  t = t.replace(/(?:之前|截止时间|截止|前)/g, ' ');
  t = t.replace(/请(?:于|在)/g, ' ');
  if (owner) t = t.split(owner).join(' ');
  t = t.replace(/\s+/g, ' ');
  for (let i = 0; i < 3; i++) {
    const before = t;
    t = t.replace(/^\s*(?:请|于|在|需|要|须|应|应当|应该|要求|务必|将|把)?\s*/, '')
         .replace(/^[,，、;；:：\s]+/, '');
    if (t === before) break;
  }
  return t.replace(/\s*，\s*/g, '，').replace(/\s+/g, ' ').replace(/^[，,、;；:：\s]+/, '').trim();
}

function extractFromParagraph(text, name, paraIdx, srcIdx) {
  const dueInfo = detectDue(text);
  if (!dueInfo) return null;
  if (!RE_VERB.test(text)) return null;

  const sentence = sentenceAt(text, dueInfo.idx);
  const owner = detectOwner(sentence);

  const reasons = [];
  if (dueInfo.vague) reasons.push('截止时间表述模糊：「' + dueInfo.dueRaw + '」');
  if (!dueInfo.hasYear) reasons.push('原文未写年份，已按当前年推算');
  if (!RE_VERB.test(sentence)) reasons.push('所在句子未找到交件动词');
  if (dueInfo.idx === 0 && !dueInfo.vague && !RE_FULL.test(sentence) && !RE_ISO.test(sentence)) {
    reasons.push('未定位到具体截止时间所在句');
  }

  const whereM = RE_WHERE.exec(sentence) || RE_WHERE.exec(text);
  const emailM = RE_EMAIL.exec(sentence);
  const where = whereM ? whereM[1].trim() : (emailM ? emailM[0] : null);
  if (!where) reasons.push('未找到交件地点');

  const action = cleanAction(sentence, owner) || cleanAction(text, owner);
  if (!action) reasons.push('未能提取出有效动作');

  return {
    id: 'it-' + (++state.seq),
    sourceName: name,
    sourceIndex: paraIdx,
    sourceText: text,
    srcIdx: srcIdx,
    action: action || '(未能提取动作，请人工补写)',
    owner: owner,
    where: where,
    due: dueInfo.vague ? null : dueInfo.due,
    dueRaw: dueInfo.dueRaw,
    confidence: reasons.length ? 'low' : 'high',
    reasons: reasons,
    status: 'pending',
    mergedFrom: 1
  };
}

function addSource(name, paragraphs) {
  const srcIdx = state.sources.length;
  state.sources.push({ name: name, paragraphs: paragraphs });
  paragraphs.forEach((text, i) => {
    const cand = extractFromParagraph(text, name, i + 1, srcIdx);
    if (cand) state.items.push(cand);
  });
  toast('已载入 ' + name + '（' + paragraphs.length + ' 段）');
}

/* ===== 渲染 ===== */
function renderSources() {
  if (!state.sources.length) { elSources.innerHTML = ''; return; }
  elSources.innerHTML = '已载入：' + state.sources.map((s) =>
    '<span class="src-chip">' + esc(s.name) + '（' + s.paragraphs.length + ' 段）</span>'
  ).join('');
}

function renderRaw() {
  if (!state.sources.length) {
    elRaw.innerHTML = '<p class="empty">还没有载入内容。先拖入一份通知，或点「用样例演示」。</p>';
    return;
  }
  let html = '';
  state.sources.forEach((src, si) => {
    html += '<div class="para-hd">' + esc(src.name) + '</div>';
    src.paragraphs.forEach((p, pi) => {
      const hl = state.highlight && state.highlight.srcIdx === si && state.highlight.paraIdx === pi + 1;
      html += '<div class="para' + (hl ? ' hl' : '') + '" data-s="' + si + '" data-p="' + (pi + 1) + '">'
            + '<span class="pno">' + (pi + 1) + '</span>' + esc(p) + '</div>';
    });
  });
  elRaw.innerHTML = html;
}

function renderReview() {
  const pending = state.items.filter((it) => it.status === 'pending');
  if (!pending.length) {
    elReview.innerHTML = '<p class="empty">抽取结果会出现在这里。<strong>低置信度的条目会标黄</strong>，必须人工确认后才会进入行动清单。</p>';
    return;
  }
  elReview.innerHTML = pending.map((it) => {
    const low = it.confidence === 'low';
    return '<article class="card' + (low ? ' low' : '') + '">'
      + '<div class="card-head">'
      + '<span class="badge' + (low ? ' warn' : '') + '">' + (low ? '低置信度' : '高置信度') + '</span>'
      + '<span class="src">' + esc(it.sourceName) + ' · 第 ' + it.sourceIndex + ' 段</span>'
      + '</div>'
      + (it.reasons.length ? '<div class="reasons">' + it.reasons.map((r) => '<span class="chip">' + esc(r) + '</span>').join('') + '</div>' : '')
      + '<div class="quote">' + esc(it.sourceText) + '</div>'
      + '<div class="fields">'
      + '<label>交什么 / 做什么<input data-id="' + it.id + '" data-field="action" value="' + esc(it.action) + '"></label>'
      + '<label>谁<input data-id="' + it.id + '" data-field="owner" value="' + esc(it.owner || '') + '" placeholder="待分配"></label>'
      + '<label>截止时间<input data-id="' + it.id + '" data-field="due" value="' + esc(it.due || '') + '" placeholder="YYYY-MM-DD 或 YYYY-MM-DD HH:mm"></label>'
      + '<label>交到哪<input data-id="' + it.id + '" data-field="where" value="' + esc(it.where || '') + '" placeholder="未识别"></label>'
      + '</div>'
      + '<div class="card-actions">'
      + '<button class="primary" data-act="confirm" data-id="' + it.id + '">确认</button>'
      + '<button data-act="discard" data-id="' + it.id + '">丢弃</button>'
      + '<button class="ghost" data-act="src" data-id="' + it.id + '">看原文出处</button>'
      + '</div></article>';
  }).join('');
}

function confirmedItems() {
  return state.items
    .filter((it) => it.status === 'confirmed' || it.status === 'done')
    .sort((a, b) => {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
    });
}

function computeConflicts() {
  for (const it of state.items) it.conflict = false;
  const byDay = new Map();
  for (const it of confirmedItems()) {
    if (!it.due) continue;
    const day = it.due.slice(0, 10);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(it);
  }
  const out = [];
  for (const [day, list] of byDay) {
    if (list.length >= 2) {
      out.push({ day: day, list: list });
      for (const it of list) it.conflict = true;
    }
  }
  out.sort((a, b) => (a.day < b.day ? -1 : 1));
  return out;
}

function renderList() {
  const items = confirmedItems();
  const conflicts = computeConflicts();

  if (conflicts.length) {
    elConflict.classList.add('on');
    elConflict.innerHTML = '<h3>撞期提醒：同一时间有多个任务</h3><ul>'
      + conflicts.map((c) => '<li><strong>' + esc(c.day) + '</strong> 共 ' + c.list.length + ' 项：'
          + c.list.map((it) => esc(it.action)).join('；') + '</li>').join('')
      + '</ul>';
  } else {
    elConflict.classList.remove('on');
    elConflict.innerHTML = '';
  }

  elListEmpty.style.display = items.length ? 'none' : 'block';
  elTodo.innerHTML = items.map((it) => {
    return '<li class="todo' + (it.status === 'done' ? ' done' : '') + '">'
      + '<input type="checkbox" data-id="' + it.id + '"' + (it.status === 'done' ? ' checked' : '') + '>'
      + '<div class="todo-body">'
      + '<div class="todo-due' + (it.due ? '' : ' vague') + '">' + esc(it.due || ('截止时间模糊（' + (it.dueRaw || '未识别') + '）')) + '</div>'
      + '<div class="todo-action">' + esc(it.action) + '</div>'
      + '<div class="todo-meta">谁：' + esc(it.owner || '待分配') + ' · 交到：' + esc(it.where || '(未识别)') + '</div>'
      + '<div class="todo-badges">'
      + (it.conflict ? '<span class="badge warn">同日撞期</span> ' : '')
      + (it.mergedFrom > 1 ? '<span class="badge mute">合并自 ' + it.mergedFrom + ' 个来源</span> ' : '')
      + '<span class="badge mute">' + esc(it.sourceName) + ' 第 ' + it.sourceIndex + ' 段</span>'
      + '</div></div>'
      + '<button class="link" data-act="src" data-id="' + it.id + '">出处</button>'
      + '</li>';
  }).join('');

  const has = items.length > 0;
  elExport.disabled = !has;
  elCopy.disabled = !has;
}

function renderAll() {
  renderSources();
  renderRaw();
  renderReview();
  renderList();
}

/* ===== 人工确认与状态流转 ===== */
function dedupKey(it) {
  return (it.action || '').replace(/\s+/g, '').replace(/[，,。.、;；:：（）()《》「」]/g, '') + '|' + (it.due || '');
}

function findItem(id) { return state.items.find((x) => x.id === id); }

function confirmItem(id) {
  const it = findItem(id);
  if (!it) return;
  const key = dedupKey(it);
  const dup = state.items.find((x) => x !== it
    && (x.status === 'confirmed' || x.status === 'done')
    && dedupKey(x) === key);
  if (dup) {
    dup.mergedFrom += 1;
    dup.sourceName = dup.sourceName + '、' + it.sourceName;
    it.status = 'discarded';
    it.mergedInto = dup.id;
    toast('与既有行动重复，已合并（合并自 ' + dup.mergedFrom + ' 个来源）');
  } else {
    it.status = 'confirmed';
    toast('已确认：' + it.action);
  }
  renderAll();
}

function jumpTo(srcIdx, paraIdx) {
  state.highlight = { srcIdx: srcIdx, paraIdx: paraIdx };
  renderRaw();
  const el = elRaw.querySelector('.para.hl');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ===== 导出 ===== */
function buildExport() {
  const items = confirmedItems();
  if (!items.length) return null;
  const lines = ['【通知猎人 · 行动清单】生成于 ' + nowStamp(), ''];
  for (const it of items) {
    lines.push('[' + (it.status === 'done' ? 'x' : ' ') + '] ' + (it.due || '截止时间模糊') + '  ' + it.action);
    if (!it.due && it.dueRaw) lines.push('    原文时间表述：' + it.dueRaw);
    lines.push('    谁：' + (it.owner || '待分配'));
    lines.push('    交到：' + (it.where || '(未识别)'));
    lines.push('    出处：' + it.sourceName + ' 第 ' + it.sourceIndex + ' 段'
      + (it.mergedFrom > 1 ? '（合并自 ' + it.mergedFrom + ' 个来源）' : ''));
    if (it.conflict) lines.push('    ⚠ 同日撞期，请核对时间');
    lines.push('');
  }
  return lines.join('\n');
}

function downloadExport() {
  const text = buildExport();
  if (!text) { toast('还没有已确认的行动项'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '通知猎人_行动清单.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已导出 ' + confirmedItems().length + ' 条行动');
}

async function copyExport() {
  const text = buildExport();
  if (!text) { toast('还没有已确认的行动项'); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
    return;
  } catch (e) { /* file:// 下可能不可用，退回 execCommand */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch (e) { toast('复制失败，请改用「导出 .txt」'); }
  ta.remove();
}

/* ===== 事件绑定 ===== */
elDrop.addEventListener('click', () => elFile.click());
elPick.addEventListener('click', (e) => { e.stopPropagation(); elFile.click(); });
elFile.addEventListener('change', () => { handleFiles(elFile.files); elFile.value = ''; });

['dragenter', 'dragover'].forEach((ev) => {
  elDrop.addEventListener(ev, (e) => { e.preventDefault(); elDrop.classList.add('over'); });
});
['dragleave', 'drop'].forEach((ev) => {
  elDrop.addEventListener(ev, (e) => { e.preventDefault(); elDrop.classList.remove('over'); });
});
elDrop.addEventListener('drop', (e) => {
  e.preventDefault();
  elDrop.classList.remove('over');
  if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
});
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => e.preventDefault());

elSample.addEventListener('click', () => {
  for (const s of SAMPLES) {
    const paras = parseTxt(s.text);
    if (paras.length) addSource(s.name, paras);
  }
  renderAll();
});

elClear.addEventListener('click', () => {
  state.sources = [];
  state.items = [];
  state.highlight = null;
  renderAll();
  toast('会话已清空');
});

elReview.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  const act = btn.getAttribute('data-act');
  const it = findItem(id);
  if (!it) return;
  if (act === 'confirm') confirmItem(id);
  else if (act === 'discard') { it.status = 'discarded'; toast('已丢弃'); renderAll(); }
  else if (act === 'src') jumpTo(it.srcIdx, it.sourceIndex);
});

elReview.addEventListener('change', (e) => {
  const inp = e.target.closest('input[data-field]');
  if (!inp) return;
  const it = findItem(inp.getAttribute('data-id'));
  if (!it) return;
  const field = inp.getAttribute('data-field');
  const v = inp.value.trim();
  if (field === 'due') {
    if (!v) { it.due = null; return; }
    if (!/^\d{4}-\d{2}-\d{2}( \d{2}:\d{2})?$/.test(v)) {
      toast('截止时间格式应为 YYYY-MM-DD 或 YYYY-MM-DD HH:mm');
      return;
    }
    it.due = v;
  } else if (field === 'owner') {
    it.owner = v || null;
  } else {
    it[field] = v;
  }
});

elTodo.addEventListener('change', (e) => {
  const cb = e.target.closest('input[type="checkbox"][data-id]');
  if (!cb) return;
  const it = findItem(cb.getAttribute('data-id'));
  if (!it) return;
  it.status = cb.checked ? 'done' : 'confirmed';
  renderAll();
});

elTodo.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act="src"]');
  if (!btn) return;
  const it = findItem(btn.getAttribute('data-id'));
  if (it) jumpTo(it.srcIdx, it.sourceIndex);
});

elExport.addEventListener('click', downloadExport);
elCopy.addEventListener('click', copyExport);

renderAll();
</script>
